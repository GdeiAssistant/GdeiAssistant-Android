title = "GdeiAssistant credential detection"

[extend]
useDefault = true

[[rules]]
id = "mongodb-userinfo-password"
description = "MongoDB URI containing a userinfo password"
regex = '''(?i)mongodb(?:\+srv)?://[^\s:/@]+:([^\s/@]+)@'''
secretGroup = 1

[[rules]]
id = "alibaba-access-key-secret"
description = "Alibaba Cloud AccessKey Secret assignment"
regex = '''(?i)(?:access[_-]?key(?:[_-]?secret)?)[\w .-]*["']?\s*[:=]\s*["']?([a-z0-9]{30})(?:["'\s,;]|$)'''
secretGroup = 1

[[rules]]
id = "configuration-secret-value"
description = "Non-placeholder credential in a properties, YAML or environment assignment"
path = '''(?:\.(?:properties|ya?ml|env|conf|ini|log|txt)$|(?:^|/)\.env(?:\.[^/]+)?$)'''
regex = '''(?im)^[\t ]*(?:export[\t ]+)?["']?[\w.-]*(?:secret|token|password|passwd|appsecret|access[_-]?key|jwt)[\w.-]*["']?[\t ]*[:=][\t ]*["']?([^\s"']{16,})(?:["'\t \r\n;#]|$)'''
secretGroup = 1

[[allowlists]]
description = "Explicit placeholder values, never a blanket source-path exclusion"
regexes = [
  '''(?i)^(?:REDACTED|(?:your[_.-])?(?:secret|token|password|appsecret|access[_.-]?key)(?:[_.-](?:here|example|placeholder))?|change[_.-]?me|replace[_.-]?me|<[^>]+>|\$\{[^\r\n]*|x{8,}|0{16,})$''',
]

[[allowlists]]
description = "Synthetic values in established test fixture directories only"
condition = "AND"
paths = ['''^app/src/test/''', '''^scripts/tests/''']
regexes = ['''(?i)^(?:test|fake|dummy|example)[_.-][a-z0-9_.-]+$''']

# Android emulator logcat system identifiers. Scoped to the logcat file and
# anchored on line text, so any other hit in the same file is still reported.
# Defined as a rule-level allowlist because a top-level [[allowlists]] block
# with paths + regexes (condition = "AND") makes gitleaks skip the whole file.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Android emulator logcat: kernel build key and keyboard cache key (system identifiers, not credentials)"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)android-emulator-logcat\.log$''']
regexes = [
  '''Build time autogenerated kernel key: [0-9a-f]{40}''',
  '''KeyboardDefCache.*Load data from cache for key: [0-9a-f]{32}''',
]
